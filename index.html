<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./CSS/main.css" />
    <title>Document</title>
  </head>
  <body>
    <!-- nikita -->
    <div class="birth-year__container"></div>

    <!-- artem -->
    <div class="guess-number__container"></div>

    <!-- maksym shamrai -->
    <div class="stone-container"></div>

    <!-- roman -->
    <div class="calculator-container">
    <div class="calculator-title">
        <div class="container calculator-title-content">
            <h1 class="calculator-title-content__title">Калькулятор</h1>
    </div>
    </div>
        <section class="calculater">
            <div class="container calculater-content">
                <form class="calculate-form">
                    <input type="text" class="calculate-form__number" id="number-one" placeholder="Введіть число">
                    <div class="calculator-actions">
                        <div class="calculate-action" id="addition">+</div>
                        <div class="calculate-action" id="multiplication">*</div>
                        <div class="calculate-action" id="minus">-</div>
                        <div class="calculate-action" id="division">/</div>
                    </div>
                <input type="text" class="calculate-form__number" id="number-two" placeholder="Введіть число">
                <button type="submit" class="calculate-result">=</button>
                </form>
                <span class="calculate-form__number" id="result">Результат</span>
            </div>
        </section>
    </div>

    <!-- maksym bohatov -->

    <div class="time-calculator__container"></div>

    <!-- andrii -->
    <div class="dino-container"></div>

    <!-- tymofii -->

    <div class="enter-numbers__container"></div>

    <script src="./JS/main.js" type="module"></script>
  </body>
</html>
