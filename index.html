<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./CSS/main.css" />
    <title>Document</title>
  </head>
  <body>
    <!-- nikita -->
    <div class="birth-year__container"></div>

    <!-- artem -->
    <div class="guess-number__container"></div>

    <!-- maksym shamrai -->
    <div class="stone-container">
      <h2 class="rps-title">Камінь - ножиці - папір</h2>
        <div class="rps-container">
          <div class="button-container">
            <button class="rock">
                <img class="rock-image" src="./images/rock.png" alt="rock">
            </button>
            <button class="paper">
               <img class="paper-image" src="./images/paper.png" alt="paper">
            </button>
            <button class="scissors">
                <img class="scissors-image" src="./images/scissors.png" alt="scissors">
            </button>
          </div>
            <div class="rps-result">
                <p class="rps-result-text">Рахунок:</p>
                <span class="rps-result-computer">Копмп'ютер - 0</span>
                <span class="rps-result-player">Ви - 0</span>
            </div>
        </div>
        <p class="rps-won">Ви виграли раунд!</p>
        <button class="rps-comp-variant">Варіант комп'ютера</button>
    </div>

    <!-- roman -->
    <div class="calculator-container"></div>

    <!-- maksym bohatov -->

    <div class="time-calculator__container"></div>

    <!-- andrii -->
    <div class="dino-container"></div>

    <!-- tymofii -->

    <div class="enter-numbers__container"></div>

    <script src="./JS/main.js" type="module"></script>
  </body>
</html>
